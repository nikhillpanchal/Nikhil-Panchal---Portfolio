<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Nikhil Panchal</title>

    <link rel="icon" href="assets/Icons/favicon.ico">
    <link rel="stylesheet" href="thankyou.css">
</head>

<body>

    <div class="landing-container">

        <div class="card thank-you-card">

            <div class="success-icon">🎉</div>

            <h1>Thank You!</h1>

            <p class="subtitle">
                Your profile has been submitted successfully.
            </p>

            <p id="thankyou-message">
            Thank you for taking the time to share your details.
            I'll review your profile carefully and contact you if a suitable
            opportunity matches your skills and experience.
            </p>

            <div class="thankyou-buttons">

                <a href="https://www.linkedin.com/in/nikhilpanchal07/" target="_blank" class="btn btn-secondary">
                    Connect on LinkedIn
                </a>

                <a href="index.html" class="btn btn-outline">
                    Return Home
                </a>

            </div>

        </div>

    </div>

    <script>
const visitor = new URLSearchParams(window.location.search).get("visitor");

const icon = document.querySelector(".success-icon");
const heading = document.querySelector("h1");
const subtitle = document.querySelector(".subtitle");
const message = document.getElementById("thankyou-message");

if (visitor === "hiring") {

    icon.textContent = "🤝";

    heading.textContent = "Thank You!";

    subtitle.textContent =
        "Your message has been received successfully.";

    message.textContent =
        "Thank you for reaching out regarding a recruitment opportunity. I appreciate your interest and will review your message carefully. I'll get back to you as soon as possible.";

}
</script>

</body>

</html>
